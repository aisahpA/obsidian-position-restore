name: Build and Release

# 发版是手工做的：merge 到 main，用 `node version-bump.mjs <major.minor.patch>`
# 定版本号（它会写 manifest.json 和 versions.json），提交、打 tag，再 push 那个 tag。
#
# 只有 TAG 会触发这个 workflow —— push 到 main 不会。给每次 merge 到 main 都构建
# 说不出新东西：分支 push 不上线任何东西，而它本该抓到的问题，几秒后这里也会用同一套
# 检查、跑在即将发布的那个 commit 上抓到。单一触发还意味着每次发版只跑一次而不是两次 ——
# 那正是「提交与 tag 一起 push」原来要付的代价。
#
# 所以这个 workflow 从不决定版本、也从不提交：它校验 tag、构建它，然后留一个草稿
# 给发版的人去发布。
on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    name: Check, build, release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 放在最前面，因为它便宜、也是那种「趁别的东西还没跑、先修好最省事」的错误：版本号改成
      # 手工命名后，tag 和 manifest 是在两个地方各写一遍的，而两个数字对不上的发布比不发布
      # 更糟 —— Obsidian 读的是 manifest，不是 tag。剥掉 "v" 前缀，是让两种写法都认。
      - name: Check the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match manifest.json $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tests/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Obsidian 要的三个文件，取自 dist/ —— 构建现在把它们放在那里。发版时这些
      # 附件保持各自的名字。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
