name: Build and Release

# A release is cut by hand: merge to main, name the version by running
# `node version-bump.mjs <major.minor.patch>` (it writes manifest.json and
# versions.json), commit it, tag it, then push the tag.
#
# Only a TAG starts this workflow — not a push to main. Building every merge
# to main said nothing new: nothing ships off a branch push, and whatever it
# would have caught gets caught here anyway, seconds later, by the same checks
# running against the very commit that is about to be released. One trigger
# also means one run per release instead of two, which is what pushing the
# commit and its tag together used to cost.
#
# So this workflow never decides a version and never commits: it checks the
# tag, builds it, and leaves a draft for whoever cut it to publish.
on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    name: Check, build, release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # First, because it is cheap and it is the one mistake that is easier to
      # fix before anything else has run: the tag and the manifest are typed in
      # two different places now that the version is named by hand, and a
      # release whose numbers disagree is worse than no release — Obsidian
      # reads the manifest, not the tag. The strip forgives a "v" prefix,
      # either way round.
      - name: Check the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match manifest.json $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tests/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The three files Obsidian asks for, out of dist/ — that is where the
      # build puts them now. The assets keep their own names on the release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
